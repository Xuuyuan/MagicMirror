name: Android release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Match the local test environment; do not change the App's device-timezone behavior.
      TZ: Asia/Shanghai
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      title: ${{ steps.metadata.outputs.title }}
      prerelease: ${{ steps.metadata.outputs.prerelease }}
      apk: ${{ steps.metadata.outputs.apk }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - name: Validate version, release history and changelog
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          tag="${RELEASE_TAG:-v$(node -p 'require("./package.json").version')}"
          node tools/release-metadata.cjs "$tag"
      - run: npm ci
      - run: npm run check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-metadata
          path: |
            dist/release-metadata.json
            dist/release-notes.md
          if-no-files-found: error
          retention-days: 7

  build:
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CI: 'true'
      NODE_ENV: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-metadata
          path: dist
      - name: Check signing configuration
        env:
          KEYSTORE_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_DATA" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo 'Configure the three Android signing Secrets before building.' >&2
            exit 1
          fi
      - run: npm ci --include=dev
      - name: Install Android build tools
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          cmdline-tools-version: 12266719
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;27.1.12297006 cmake;3.22.1
          log-accepted-android-sdk-licenses: false
      - name: Generate native project and build ARM64 release
        run: |
          backup="$RUNNER_TEMP/magicmirror-package.json"
          package_path="$GITHUB_WORKSPACE/package.json"
          cp "$package_path" "$backup"
          trap 'cp "$backup" "$package_path"' EXIT
          npx expo prebuild --platform android --no-install --clean
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a
      - name: Restore signing key
        env:
          KEYSTORE_DATA: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_DATA" | base64 --decode > "$RUNNER_TEMP/magicmirror-release.p12"
      - name: Sign with the existing release certificate
        shell: pwsh
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APK_NAME: ${{ needs.checks.outputs.apk }}
        run: |
          ./tools/sign-apk.ps1 -InputPath android/app/build/outputs/apk/release/app-release.apk -OutputPath "dist/$env:APK_NAME" -KeystorePath "$env:RUNNER_TEMP/magicmirror-release.p12" -KeyAlias magicmirror -NonInteractive -ExpectedCertificateSha256 c0eb0506c4aee5f28b8c77402ea88fbf776e106a4066766ad08aec0871e5cee3
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/magicmirror-release.p12"
      - name: Verify APK metadata and write checksum
        run: node tools/verify-release-apk.cjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release
          path: |
            dist/*-signed.apk
            dist/SHA256SUMS.txt
            dist/release-notes.md
            dist/release-metadata.json
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [checks, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release
          path: dist
      - name: Create draft, upload assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.checks.outputs.tag }}
          RELEASE_TITLE: ${{ needs.checks.outputs.title }}
          PRERELEASE: ${{ needs.checks.outputs.prerelease }}
          APK_NAME: ${{ needs.checks.outputs.apk }}
        run: |
          # A failed upload leaves a draft. Retry only that draft; published assets are never replaced.
          if existing=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft'); then
            if [[ "$existing" != true ]]; then
              echo 'This version is already published.' >&2
              exit 1
            fi
          else
            args=(--draft --verify-tag --title "$RELEASE_TITLE" --notes-file dist/release-notes.md)
            if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          cd dist
          sha256sum --check SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" "$APK_NAME" SHA256SUMS.txt --clobber
          args=(--draft=false)
          if [[ "$PRERELEASE" == true ]]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
          gh release edit "$RELEASE_TAG" "${args[@]}"
